name: catalog-e2e-test
services:
  postgres:
    image: 'postgres:18.6'
    environment:
      - 'POSTGRES_DB=catalog'
      - 'POSTGRES_USER=catalog'
      - 'POSTGRES_PASSWORD=catalog'
    volumes:
      - pgdata:/var/lib/postgresql
  catalog-be:
    depends_on:
      - postgres
    image: 'catalog-e2e-test-be:local'
    build:
      context: ../../catalog-be
    ports:
      - '8110:8080'
    environment:
      - CATALOG_SECURITY_USERNAME=catalog
      - CATALOG_SECURITY_PASSWORD=catalog
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/catalog
      - SPRING_DATASOURCE_USERNAME=catalog
      - SPRING_DATASOURCE_PASSWORD=catalog
  catalog-fe:
    depends_on:
      - catalog-be
    image: 'catalog-e2e-test-fe:local'
    build:
      context: ./fe
    ports:
      - '8010:80'
volumes:
  pgdata:
